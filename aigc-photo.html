                prompt:
                    "Woman in sunlight variant, soft lighting, gentle expression, outdoor setting.",
            },
            {
                src: "images/aigc/真实/1023117972237251-11_36_09.mp4",
                type: "video",
                prompt:
                    "AIGC generated video, realistic motion, artistic style, smooth transitions.",
            },
            {
                src: "images/aigc/真实/anethereal-927200614-11_32_10-0.png",
                type: "image",
                prompt:
                    "Chinese girl in red sweater, studio lighting, realistic style.",
            },
            {
                src: "images/aigc/真实/anethereal-2964012035-11_42_44-0.png",
                type: "image",
                prompt:
                    "Young woman with long hair, soft background, natural expression.",
            },
            {
                src: "images/aigc/真实/IntimateMo-705261385-12_30_00-0.png",
                type: "image",
                prompt: "Surreal composition, vibrant colors, imaginative concept.",
            },
        ];

        // 图片展示类 - 采用new.html的策略
        class ImageGallery {
            constructor() {
                this.container = document.getElementById("imageRows");
                this.init();
            }

            init() {
                this.populateImages();
                this.bindEvents();
                this.hideLoading();
            }

            populateImages() {
                images.forEach((item, index) => {
                    const rowElement = document.createElement("div");
                    rowElement.className = "row";

                    // 创建图片容器
                    const imageContainer = document.createElement("div");
                    imageContainer.className = "new-i";

                    if (item.type === "video") {
                        const video = document.createElement("video");
                        video.src = item.src;
                        video.controls = true;
                        video.muted = true;
                        video.loop = true;
                        video.width = "100%";
                        imageContainer.appendChild(video);
                    } else {
                        const img = document.createElement("img");
                        img.src = item.src;
                        img.alt = item.prompt || item.title;
                        img.width = "100%";
                        img.loading = "lazy";
                        imageContainer.appendChild(img);
                    }

                    // 创建描述文字
                    const descContainer = document.createElement("div");
                    descContainer.className = "new-tt";
                    const descElement = document.createElement("p");
                    descElement.textContent = item.prompt || item.title;
                    descContainer.appendChild(descElement);

                    // 组装行元素
                    rowElement.appendChild(imageContainer);
                    rowElement.appendChild(descContainer);

                    this.container.appendChild(rowElement);
                });
            }

            bindEvents() {
                // 只监听图片和视频的点击事件
                this.container.addEventListener("click", (e) => {
                    if (e.target.tagName === "IMG" || e.target.tagName === "VIDEO") {
                        this.openLightbox(e.target);
                    }
                });
            }

            openLightbox(media) {
                // 隐藏顶部导航栏
                const navAll = document.querySelector(".nav-all");
                if (navAll) navAll.style.display = "none";

                // 获取 prompt 文本
                let promptText = "";
                if (media.tagName === "IMG" || media.tagName === "VIDEO") {
                    promptText = media.alt || "";
                    if (!promptText) {
                        const found = images.find((item) => item.src === media.src);
                        if (found) promptText = found.prompt || "";
                    }
                }

                // 创建灯箱遮罩
                const lightbox = document.createElement("div");
                lightbox.style.cssText = `
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: #fff;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 99999;
        cursor: pointer;
    `;

                // 内容容器，横向排列
                const contentBox = document.createElement("div");
                contentBox.style.cssText = `
        display: flex;
        flex-direction: row;
        align-items: center;
        max-width: 96vw;
        max-height: 90vh;
        gap: 40px;
    `;

                let bigMedia;
                if (media.tagName === "IMG") {
                    bigMedia = document.createElement("img");
                    bigMedia.src = media.src;
                    bigMedia.alt = media.alt || "";
                    bigMedia.style.cssText = `
            max-width: 60vw;
            max-height: 90vh;
            border-radius: 8px;
            background: #fff;
            display: block;
        `;
                } else if (media.tagName === "VIDEO") {
                    bigMedia = document.createElement("video");
                    bigMedia.src = media.src;
                    bigMedia.controls = true;
                    bigMedia.autoplay = true;
                    bigMedia.loop = true;
                    bigMedia.muted = true;
                    bigMedia.style.cssText = `
            max-width: 60vw;
            max-height: 90vh;
            border-radius: 8px;
            background: #fff;
            display: block;
        `;
                }

                // prompt 展示容器
                const promptBox = document.createElement("div");
                promptBox.style.cssText = `
        max-width: 32vw;
        font-size: 1.1rem;
        color: #222;
        background: #fff;
        padding: 24px 18px;
        border-radius: 8px;
        word-break: break-all;
        box-sizing: border-box;
        line-height: 1.7;
        box-shadow: none;
    `;
                promptBox.textContent = promptText;

                contentBox.appendChild(bigMedia);
                contentBox.appendChild(promptBox);
                lightbox.appendChild(contentBox);
                document.body.appendChild(lightbox);

                // 点击遮罩关闭
                lightbox.addEventListener("click", () => {
                    document.body.removeChild(lightbox);
                    if (navAll) navAll.style.display = "";
                    document.removeEventListener("keydown", handleKeydown);
                });

                // ESC键关闭
                function handleKeydown(e) {
                    if (e.key === "Escape") {
                        if (document.body.contains(lightbox)) {
                            document.body.removeChild(lightbox);
                            if (navAll) navAll.style.display = "";
                        }
                        document.removeEventListener("keydown", handleKeydown);
                    }
                }
                document.addEventListener("keydown", handleKeydown);
            }

            hideLoading() {
                setTimeout(() => {
                    const loading = document.getElementById("loading");
                    if (loading) {
                        loading.style.opacity = "0";
                        setTimeout(() => {
                            loading.style.display = "none";
                        }, 300);
                    }
                }, 1000);
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
